services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartrecomenda:latest
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: sqlite:////app/data/smartrecomenda.db
      AUTH_COOKIE_SECURE: 'true'
      AUTH_COOKIE_SAMESITE: none
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
    ports:
      - '8000:8000'
    restart: unless-stopped
    volumes:
      - smartrecomenda-data:/app/data

volumes:
  smartrecomenda-data:
